<!DOCTYPE html>
<html>

<head>
    <title>Meu Site Gamer</title>

    <style>

        body {
            background: linear-gradient(to right, #000000, #1a1a1a);
            color: white;
            font-family: Arial;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: cyan;
            color: black;
            padding: 20px;
            font-size: 30px;
            font-weight: bold;
        }

        .caixa {
            background-color: #222;
            width: 300px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px cyan;
        }

        button {
            background-color: cyan;
            color: black;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: white;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background-color: #111;
        }

    </style>
</head>

<body>

    <header>
        Meu Primeiro Site 🚀
    </header>

    <div class="caixa">

        <h1>Bem-vindo</h1>

        <p>
            Estou aprendendo HTML, CSS e JavaScript.
        </p>

        <button onclick="mensagem()">
            Entrar
        </button>

    </div>

    <div class="caixa">

        <h2>Sobre mim</h2>

        <p>
            Quero me tornar programador.
        </p>

    </div>

    <footer>
        Criado por Vandeson 💻
    </footer>

    <script>

        function mensagem() {
            alert("Bem-vindo ao meu site!")
        }

    </script>

</body>

</html>
