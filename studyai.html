<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyAI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
text-align:center;
padding:20px;
}

header{
padding:30px;
}

h1{
font-size:3rem;
margin-bottom:10px;
}

p{
color:#cbd5e1;
}

.container{
max-width:800px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
margin:15px 0;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

textarea{
width:100%;
height:120px;
padding:10px;
border:none;
border-radius:10px;
font-size:16px;
margin-top:10px;
}

button{
background:#22c55e;
color:white;
border:none;
padding:12px 25px;
border-radius:10px;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

button:hover{
transform:scale(1.05);
}

#resposta{
margin-top:20px;
padding:15px;
background:#334155;
border-radius:10px;
text-align:left;
}

footer{
margin-top:40px;
color:#94a3b8;
}
</style>

</head>
<body>

<header>
<h1>🤖 StudyAI</h1>
<p>Seu assistente de estudos inteligente</p>
</header>

<div class="container">

<div class="card">
<h2>Faça sua pergunta</h2>

<textarea id="pergunta" placeholder="Ex: O que é HTML?"></textarea>

<button onclick="responder()">
Perguntar
</button>

<div id="resposta">
Sua resposta aparecerá aqui.
</div>
</div>

<div class="card">
<h2>📚 Matérias</h2>
<p>Matemática</p>
<p>Inglês</p>
<p>História</p>
<p>Programação</p>
</div>

<div class="card">
<h2>🎯 Objetivo</h2>
<p>Aprender qualquer assunto de forma simples.</p>
</div>

</div>

<footer>
© 2026 StudyAI
</footer>

<script>

function responder(){

let pergunta =
document.getElementById("pergunta").value;

let resposta =
document.getElementById("resposta");

if(pergunta == ""){
resposta.innerHTML =
"Digite uma pergunta.";
return;
}

resposta.innerHTML =
"Você perguntou: <b>" +
pergunta +
"</b><br><br>Em breve a IA responderá automaticamente.";

}

</script>

</body>
</html>
