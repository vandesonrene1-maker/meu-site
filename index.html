<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Streetwear Store</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0d0d0d;
      color:white;
    }

    header{
      height:100vh;
      background:linear-gradient(
      135deg,
      #ff0066,
      #6a00ff,
      #00d9ff
      );
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    .hero h1{
      font-size:60px;
      margin-bottom:20px;
      text-transform:uppercase;
    }

    .hero p{
      font-size:20px;
      margin-bottom:30px;
    }

    .btn{
      display:inline-block;
      padding:15px 35px;
      background:white;
      color:black;
      text-decoration:none;
      border-radius:30px;
      font-weight:bold;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.1);
      background:#00d9ff;
      color:white;
    }

    .produtos{
      padding:80px 20px;
      text-align:center;
    }

    .produtos h2{
      font-size:40px;
      margin-bottom:50px;
      color:#00d9ff;
    }

    .cards{
      display:flex;
      justify-content:center;
      gap:30px;
      flex-wrap:wrap;
    }

    .card{
      background:#1a1a1a;
      border-radius:20px;
      overflow:hidden;
      width:300px;
      transition:0.3s;
      box-shadow:0 0 20px rgba(0,217,255,0.2);
    }

    .card:hover{
      transform:translateY(-10px);
    }

    .card img{
      width:100%;
      height:350px;
      object-fit:cover;
    }

    .card h3{
      margin:20px 0 10px;
      font-size:24px;
    }

    .preco{
      color:#00ff99;
      font-size:22px;
      margin-bottom:20px;
    }

    .comprar{
      display:inline-block;
      margin-bottom:25px;
      padding:12px 25px;
      background:#ff0066;
      color:white;
      text-decoration:none;
      border-radius:25px;
      transition:0.3s;
    }

    .comprar:hover{
      background:#00d9ff;
    }

    footer{
      padding:30px;
      text-align:center;
      background:black;
      color:#888;
    }

    @media(max-width:768px){

      .hero h1{
        font-size:40px;
      }

      .hero p{
        font-size:16px;
      }

    }

  </style>
</head>

<body>

  <header>
    <div class="hero">
      <h1>Streetwear</h1>
      <p>DROP NOVO • ESTILO URBANO • LIMITED</p>

      <a class="btn" href="https://wa.me/seunumero">
        Comprar Agora
      </a>
    </div>
  </header>

  <section class="produtos">

    <h2>Camisas em Destaque</h2>

    <div class="cards">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=1200&auto=format&fit=crop" alt="">
        <h3>Oversized Black</h3>
        <p class="preco">R$ 89,90</p>

        <a class="comprar" href="https://wa.me/seunumero">
          Comprar
        </a>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?q=80&w=1200&auto=format&fit=crop" alt="">
        <h3>Urban Style</h3>
        <p class="preco">R$ 99,90</p>

        <a class="comprar" href="https://wa.me/seunumero">
          Comprar
        </a>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=1200&auto=format&fit=crop" alt="">
        <h3>Limited Drop</h3>
        <p class="preco">R$ 109,90</p>

        <a class="comprar" href="https://wa.me/seunumero">
          Comprar
        </a>
      </div>

    </div>

  </section>

  <footer>
    © 2026 Streetwear Store • Todos os direitos reservados
  </footer>

</body>
</html>
